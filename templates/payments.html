{% set page_title = "Payments" %}
{% extends "_base.html" %}

{% block content %}
  <div class="grid" style="max-width: 900px;">
    <section class="card card-pad">
      <h1>Record Payment</h1>
      <p class="muted">Admin panel · Logged in as: {{ phone }}</p>
    </section>

    <section class="card card-pad">
      <form method="POST" class="form-row">
        <div>
          <label>Student Phone</label>
          <input name="student_phone" autocomplete="tel" />
        </div>

        <div class="grid grid-2">
          <div>
            <label>Class No</label>
            <input name="class_no" inputmode="numeric" />
          </div>
          <div>
            <label>Section (A/B)</label>
            <input name="section" value="A" />
          </div>
        </div>

        <div class="grid grid-2">
          <div>
            <label>Academic Year</label>
            <input name="academic_year" value="{{ 2026 }}" inputmode="numeric" />
          </div>
          <div>
            <label>Month (1-12)</label>
            <input name="fee_month" inputmode="numeric" />
          </div>
        </div>

        <div class="grid grid-2">
          <div>
            <label>Paid Amount</label>
            <input name="paid_amount" inputmode="numeric" />
          </div>
          <div>
            <label>Note (optional)</label>
            <input name="note" />
          </div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit">Record Payment</button>
          <a class="btn btn-ghost" href="{{ url_for('admin_payments_history') }}">Payments History</a>
          <a class="btn btn-ghost" href="/dashboard/admin/">Back to Dashboard</a>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
