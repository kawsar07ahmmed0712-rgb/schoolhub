{% set page_title = title or "Error" %}
{% extends "_base.html" %}

{% block content %}
  <div class="card card-pad" style="max-width: 900px;">
    <h1>{{ title or "Error" }}</h1>

    {% if role %}
      <p class="muted">Role: {{ role }}</p>
    {% endif %}

    {% if phone %}
      <p class="muted">Logged in as: {{ phone }}</p>
    {% endif %}

    <div class="alert">{{ message }}</div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn btn-primary" href="{{ url_for('home') }}">Go Home</a>
      {% if role %}
        <a class="btn btn-ghost" href="/dashboard/{{ role }}/">Back to Dashboard</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
