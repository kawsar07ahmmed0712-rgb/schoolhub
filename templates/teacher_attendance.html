<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolHub - Take Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>

  <body>
    <h1>Take Attendance</h1>

    <p><strong>Class:</strong> {{ class_no }} | <strong>Section:</strong> {{ section }}</p>

    {% if message %}
      <p>{{ message }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('teacher_attendance', role=role) }}">
      <label for="date">Date</label>
      <input id="date" name="date" type="date" value="{{ date_str }}" />
      <button type="submit">Save Attendance</button>

      <br /><br />

      <table border="1" cellpadding="8">
        <thead>
          <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Present?</th>
          </tr>
        </thead>
        <tbody>
          {% for s in students %}
            {% set st = status_map.get(s.student_id) %}
            <tr>
              <td>{{ s.roll }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.phone }}</td>
              <td>
                <input
                  type="checkbox"
                  name="present_ids"
                  value="{{ s.student_id }}"
                  {% if st != 'absent' %}checked{% endif %}
                />
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>

      <p><a href="{{ url_for('dashboard', role=role) }}">← Back to Dashboard</a></p>
    </form>
  </body>
</html>
