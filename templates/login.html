{% set page_title = "Login" %}
{% extends "_base.html" %}

{% block content %}
  <div class="content-inner" style="max-width: 720px;">
    <div class="card card-pad">
      <h1>Login</h1>
      <p class="muted">Role: <span class="badge">{{ role }}</span></p>

      {% if message %}
        <div class="alert">{{ message }}</div>
      {% endif %}

      <form method="post" action="/login" class="form-row" style="margin-top: 12px;">
        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="text" value="{{ phone or '' }}" autocomplete="username" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 6px;">
          <button class="btn btn-primary" type="submit">Sign in</button>
          <a class="btn btn-ghost" href="{{ url_for('home') }}">Change role</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
