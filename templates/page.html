{% set page_title = page_title or "Page" %}
{% extends "_base.html" %}

{% block content %}
  <div class="card card-pad" style="max-width: 900px;">
    <h1>{{ page_title }}</h1>
    <p class="muted">This page is a placeholder. Real UI will be added later.</p>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px;">
      {% if role %}
        <a class="btn btn-primary" href="{{ url_for('dashboard', role=role) }}">Back to Dashboard</a>
      {% else %}
        <a class="btn btn-primary" href="{{ url_for('home') }}">Home</a>
      {% endif %}
      <a class="btn btn-ghost" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>
{% endblock %}
