{% set page_title = "Fees Setup" %}
{% extends "_base.html" %}

{% block content %}
  <div class="grid" style="max-width: 900px;">
    <section class="card card-pad">
      <h1>Fees Setup</h1>
      <p class="muted">Admin panel · Logged in as: {{ phone }}</p>
    </section>

    <section class="card card-pad">
      <form method="POST" class="form-row">
        <div class="grid grid-2">
          <div>
            <label>Class No</label>
            <input name="class_no" inputmode="numeric" />
          </div>
          <div>
            <label>Section (A/B)</label>
            <input name="section" value="A" />
          </div>
        </div>

        <div class="grid grid-2">
          <div>
            <label>Academic Year</label>
            <input name="academic_year" value="{{ academic_year or 2026 }}" inputmode="numeric" />
          </div>
          <div>
            <label>Month (1-12)</label>
            <input name="fee_month" inputmode="numeric" />
          </div>
        </div>

        <div>
          <label>Amount</label>
          <input name="amount" inputmode="numeric" />
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit">Save Fee Plan</button>
          <a class="btn btn-ghost" href="/dashboard/admin/">Back to Dashboard</a>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
